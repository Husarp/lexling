<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <link rel="stylesheet" href="_ds/13devs-design-system-46729e75-d852-4f10-a6fd-7ccedc6b6ec4/tokens/fonts.css">
  <style>body{margin:0;background:#0d0d0d;color:#fff;font-family:Inter,system-ui,sans-serif}a{color:#fff}a:hover{color:#DB5126}</style>
</helmet>
<section id="1a" style="display:flex;flex-direction:column;gap:40px;padding:40px">
  <div style="display:flex;flex-direction:column;gap:8px">
    <span style="font:800 40px/1.05 'Barlow Condensed',sans-serif;letter-spacing:-.02em;text-transform:uppercase">Word<b style="color:#DB5126">/</b>Guess — handoff screens</span>
    <span style="font-size:13px;color:#9E9E9E">6 self-contained files in <code>handoff/</code> · each shown at 360 px and 1100 px</span>
  </div>
  <sc-for list="{{ screens }}" as="s" hint-placeholder-count="6">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="width:4px;height:20px;background:#DB5126"></span>
        <a href="{{ s.href }}" target="_blank" style="font:700 22px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:-.01em;text-decoration:none">{{ s.name }}</a>
        <span style="font-size:12px;color:#9E9E9E;letter-spacing:.08em;text-transform:uppercase">{{ s.href }}</span>
      </div>
      <div style="display:flex;gap:24px;align-items:flex-start">
        <iframe src="{{ s.href }}" title="{{ s.name }} · 360" style="width:360px;height:760px;border:1px solid #333;border-radius:4px;background:#000;flex:none"></iframe>
        <iframe src="{{ s.href }}" title="{{ s.name }} · 1100" style="width:1100px;height:760px;border:1px solid #333;border-radius:4px;background:#000;flex:none"></iframe>
      </div>
    </div>
  </sc-for>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { screens: [
      { name: 'Main menu', href: 'handoff/main-menu.html' },
      { name: 'Game picker · full + empty', href: 'handoff/game-picker.html' },
      { name: 'New game settings', href: 'handoff/new-game.html' },
      { name: 'Game · empty / mid-game / won', href: 'handoff/game.html' },
      { name: 'Achievements & stats · locked vs unlocked', href: 'handoff/achievements.html' },
      { name: 'Settings', href: 'handoff/settings.html' },
    ] };
  }
}
</script>
</body>
</html>
