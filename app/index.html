<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<title>Lexling</title>
<!-- the page is already the right colour before any stylesheet or script arrives: no white flash -->
<style>html{background:var(--bg,#000)}</style>
<script src="js/compat.js"></script>
<script src="js/boot.js"></script>
<script>
// Whole palettes before first paint (owner, 2026-11-14); keep in step with PALETTES in js/ui.js and css/app.css.
var palettes = { classic: { dark: '#000000', light: '#F5F5F5' }, paper: { dark: '#211D19', light: '#F7F0DF' },
  ocean: { dark: '#101C28', light: '#EDF5FA' }, forest: { dark: '#142019', light: '#EFF5EC' }, contrast: { dark: '#000000', light: '#FFFFFF' } };
var saved = {};
try {
  saved = JSON.parse(localStorage.getItem('wg.settings')) || {};
} catch (e) {}
var theme = saved.theme === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : saved.theme === 'light' ? 'light' : 'dark';
var palette = Object.hasOwn(palettes, saved.palette) ? saved.palette : 'classic';
document.documentElement.dataset.theme = theme;
document.documentElement.dataset.palette = palette;
document.documentElement.style.backgroundColor = palettes[palette][theme];
document.querySelector('meta[name=theme-color]').content = palettes[palette][theme];
// Tablets (owner, 2026-10-12): the phone layout, bigger - the page is laid out about 640 px on its short side and the
// screen zooms it to fill itself, so letters, tiles and buttons grow with the screen; held sideways, the wide layouts.
// Phones and computers as before. (The Android app turns its WebView's wide viewport on for this - MainActivity.)
(function () {
  var meta = document.querySelector('meta[name=viewport]'), plain = meta.content;
  function fit() {
    var w = Math.max(screen.width, screen.height), h = Math.min(screen.width, screen.height), k = Math.min(1.6, h / 640);
    if (k < 1.1 || !matchMedia('(pointer: coarse)').matches) { if (meta.content !== plain) meta.content = plain; return; }
    var content = 'width=' + Math.round((innerWidth > innerHeight ? w : h) / k) + ', viewport-fit=cover, interactive-widget=resizes-content';
    if (meta.content !== content) meta.content = content;
  }
  fit();
  addEventListener('resize', fit);
})();
</script>
<link rel="preload" href="fonts/BarlowCondensed-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/BarlowCondensed-Bold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/Inter-Regular.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="fonts/Inter-Medium.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="fonts/Inter-SemiBold.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="root"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
