<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<title>Lexling</title>
<!-- the page is already the right colour before any stylesheet or script arrives: no white flash -->
<style>html{background:#000}html[data-theme=light]{background:#F5F5F5}</style>
<script>
try {
  var theme = (JSON.parse(localStorage.getItem('wg.settings')) || {}).theme || 'dark';
  if (theme === 'system') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = theme;
} catch (e) {}
// Tablets (owner, 2026-10-12): the phone layout, bigger - the page is laid out about 640 px on its short side and the
// screen zooms it to fill itself, so letters, tiles and buttons grow with the screen; held sideways, the wide layouts.
// Phones and computers as before. (The Android app turns its WebView's wide viewport on for this - MainActivity.)
(function () {
  var meta = document.querySelector('meta[name=viewport]'), plain = meta.content;
  function fit() {
    var w = Math.max(screen.width, screen.height), h = Math.min(screen.width, screen.height), k = Math.min(1.6, h / 640);
    if (k < 1.1 || !matchMedia('(pointer: coarse)').matches) { if (meta.content !== plain) meta.content = plain; return; }
    var content = 'width=' + Math.round((innerWidth > innerHeight ? w : h) / k) + ', viewport-fit=cover, interactive-widget=resizes-content';
    if (meta.content !== content) meta.content = content;
  }
  fit();
  addEventListener('resize', fit);
})();
</script>
