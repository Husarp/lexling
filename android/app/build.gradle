apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def checkout = rootProject.projectDir.parentFile.canonicalFile
def configOutput = providers.exec {
    workingDir checkout
    commandLine 'node', 'scripts/ota-config.mjs', 'android'
}.standardOutput.asText.get()
def ota = new groovy.json.JsonSlurper().parseText(configOutput)

def releaseRequested = gradle.startParameter.taskNames.any {
    def task = it.tokenize(':').last().toLowerCase(Locale.ROOT)
    task.contains('release') || task in ['build', 'assemble', 'bundle']
}
def releaseSigning = null
if (releaseRequested) {
    def configuredKeystore = file(ota.signing.keystore).canonicalFile
    def propertiesFile = file(ota.signing.properties).canonicalFile
    if (configuredKeystore.isFile() && [configuredKeystore, propertiesFile].every { !it.toPath().startsWith(checkout.toPath()) }) {
        def storePass = providers.environmentVariable(ota.signing.storePasswordEnv).orNull
        def keyPass = providers.environmentVariable(ota.signing.keyPasswordEnv).orNull
        if ((!storePass || !keyPass) && propertiesFile.isFile()) {
            def signingInput = new Properties()
            propertiesFile.withInputStream { signingInput.load(it) }
            storePass = storePass ?: signingInput.getProperty('storePassword')
            keyPass = keyPass ?: signingInput.getProperty('keyPassword')
        }
        if (storePass && keyPass) {
            releaseSigning = [file: configuredKeystore, alias: ota.signing.keyAlias, storePass: storePass, keyPass: keyPass]
        }
    }
    // The existing Windows build script supplies a complete signing configuration in this file.
    if (!releaseSigning) {
        def legacyFile = rootProject.file('keystore.properties')
        def legacy = new Properties()
        if (legacyFile.isFile()) legacyFile.withInputStream { legacy.load(it) }
        if (legacy.storeFile && legacy.keyAlias && legacy.storePassword && legacy.keyPassword) {
            def keystore = file(legacy.storeFile).canonicalFile
            if (keystore.isFile() && !keystore.toPath().startsWith(checkout.toPath())) {
                releaseSigning = [file: keystore, alias: legacy.keyAlias, storePass: legacy.storePassword, keyPass: legacy.keyPassword]
            }
        }
    }
}

android {
    namespace "com.husarp.lexling"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId ota.appId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ota.build.versionCode as int
        versionName ota.build.versionName
        resValue 'string', 'app_name', ota.appName
        buildConfigField 'String', 'OTA_BUNDLE_URL', groovy.json.JsonOutput.toJson(ota.urls.bundle)
        buildConfigField 'String', 'OTA_SHELL_URL', groovy.json.JsonOutput.toJson(ota.urls.shell)
        buildConfigField 'String', 'OTA_RELEASES_URL', groovy.json.JsonOutput.toJson(ota.urls.releases)
        buildConfigField 'int', 'SHELL_API', "${ota.build.shellApi}"
        buildConfigField 'long', 'SHELL_RELEASED_AT', "${Long.parseLong(findProperty('shellReleasedAt') ?: '0')}L"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        if (releaseSigning) release {
            storeFile releaseSigning.file
            storePassword releaseSigning.storePass
            keyAlias releaseSigning.alias
            keyPassword releaseSigning.keyPass
        }
    }
    buildTypes {
        // Test builds install next to the real app and never update it (owner, 2026-11-26)
        debug {
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
            resValue 'string', 'app_name', ota.appName + ' Test'
        }
        release {
            if (releaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}
kotlin {
    jvmToolchain(21)
    compilerOptions {
        // Nearby 19.5.0 ships Kotlin 2.4 metadata. Lexling uses its Java API.
        freeCompilerArgs.add('-Xskip-metadata-version-check')
    }
}

def verifyReleaseConfig = tasks.register('verifyReleaseConfig') {
    doLast {
        if (!releaseSigning) throw new GradleException('Configure the existing Lexling release keystore before building a release.')
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn verifyReleaseConfig }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation project(':core')
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Tiles on several phones through Google's Nearby Connections (Google Play services on the phone)
    implementation "com.google.android.gms:play-services-nearby:19.5.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
